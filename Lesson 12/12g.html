<!DOCTYPE html>
<html>
    <head>
        <title> Lesson 12 </title>
        <style>
            div{
                font-family: Arial, Helvetica, sans-serif;
            }

            .profile{
                display: flex;
                align-items: center;
                margin-bottom: 20px;
                justify-content: space-between;
                width: 330px;
            }

            img{
                width: 50px;
                height: 50px;
                border-radius: 50px;
            }

            .info{
                display: flex;
                flex-direction: column;
                width: 180px;
            }

            .name{
                font-weight: bold;
                padding-bottom: 2px;
            }

            .text{
                color: gray;
                padding-bottom: 2px;
            }

            .popular{
                color: gray;
                font-size: 15px;
            }

            .follow{
                background-color: rgb(61, 188, 238);
                color: white;
                font-weight: bold;
                font-size: 15px;
                border-radius: 4px;
                padding-top: 6px;
                padding-bottom: 6px;
                padding-left: 10px;
                padding-right: 10px;
            }
        </style>
    </head>
    <body>
        <div class="profile">
            <div class="dp"> 
                <img src="cat.png">
            </div>
            <div class="info">
                <div class="name"> Oliver </div>
                <div class="text"> the cat </div>
                <div class="popular"> Popular </div>
            </div>
            <div class="follow"> Follow </div>
        </div>
        <div class="profile">
            <div class="dp"> 
                <img src="cat2.png">
            </div>
            <div class="info">
                <div class="name"> Mimi </div>
                <div class="text"> Baby cat </div>
                <div class="popular"> Popular </div>
            </div>
            <div class="follow"> Follow </div>
        </div>
        <div class="profile">
            <div class="dp"> 
                <img src="cat3.png">
            </div>
            <div class="info">
                <div class="name"> Fluffy </div>
                <div class="text"> Happy cat </div>
                <div class="popular"> Popular </div>
            </div>
            <div class="follow"> Follow </div>
        </div>
    </body>
</html>
