<!DOCTYPE html>
<html lang="en">
<head>
    <title>Lesson 7</title>
    <style>
        span{
            font-family: Arial, Helvetica, sans-serif;
            padding-left: 8px;
        }

        .cat{
            width: 170px;
            object-fit: cover;
            object-position: center;
            display: block;
            padding-bottom: 8px;
        }

        .name{
            font-weight: bolder;
            font-size: 17px;
            display: block;
        }

        .text{
            color: gray;
            font-size: 16px;
            display: block;
            margin-bottom: 20px;
        }

        .tweet{
            background-color: rgb(19, 175, 236);
            color: white;
            font-weight: bold;
            font-size: 14px;
            border-radius: 4px;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 20px;
            padding-right: 20px;
            margin-left: 8px;

        }

        .box{
            border: solid;
            border-radius: 4px;
            border-width: 2px;
            width: 170px;
            padding-bottom: 18px;
            border-color: rgb(226, 225, 225);

        }
    </style>
</head>
<body>
    <div class="box">
        <img class="cat" src="cat.png">
        <span class="name"> Oliver </span>
        <span class="text"> 2 mutual friends </span>
        <span class="tweet"> Add Friend </span>
    </div>
</body>
</html>
