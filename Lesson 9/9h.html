<!DOCTYPE html>
<html lang="en">
<head>
    <title>Lesson 8</title>
    <style>
        div{
            text-align: center;
            font-family: Arial, Helvetica, sans-serif ;
        }

        .img{
            width: 200px;
            margin-bottom: 10px;
        }

        .search-box{
            font-size: 18px;
            width: 550px;
            padding-top: 14px;
            padding-bottom: 14px;
            padding-left: 18px;
            border-radius: 10px;
            border: none;
            box-shadow: 0px 2px 15px rgba(0, 0, 0, 0.2);
            border-radius: 30px;
            margin-bottom: 40px;
        }

        .button{
            border: none;
            background-color: rgb(245, 243, 243);
            padding-right: 10px;
            padding-left: 10px;
            padding-top: 10px;
            padding-bottom: 10px;
            margin-left: 40px;
        }
    </style>
</head>
<body>
    <div>
        <img src="google.webp" class="img">
    </div>
    <div>
        <input type="text" class="search-box" placeholder="Search Google or type a URL">
    </div>
    <div>
        <span class="button"> Google Search </span>
        <span class="button"> I'm Feeling Lucky </span>
    </div>
</body>
</html>
