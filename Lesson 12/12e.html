<!DOCTYPE html>
<html lang="en">
<head>
    <title>Lesson 12</title>
    <style>
        div {
            font-family: Arial;
        }

        .container {
            border-width: 1px;
            border-style: solid;
            border-color: rgb(163, 162, 162);
            width: 300px;
            border-radius: 6px;
        }

        .flex {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            padding-top: 6px;
            padding-bottom: 6px;
            padding-left: 12px;
            padding-right: 12px;
        }

        .info{
            background-color: rgb(24, 166, 223);
            color: white;
            padding-top: 3px;
            padding-bottom: 3px;
            padding-left: 10px;
            padding-right: 10px;
            border-radius: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="flex">
            <div>Home</div>
            <div class="info">14</div>
        </div>
        <div class="flex">
            <div>Notifications</div>
            <div class="info">3</div>
        </div>
        <div class="flex">
            <div>Messages</div>
            <div class="info">5</div>
        </div>
    </div>
</body>
</html>
