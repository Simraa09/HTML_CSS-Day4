<!DOCTYPE html>
<html lang="en">
<head>
    <title>Lesson 7</title>
    <style>
        .cat{
            width: 70px;
            object-fit: cover;
            object-position: center;
            border-radius: 200px;
            vertical-align: middle;
        }

        .text{
            color: gray;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 22px;
            vertical-align: middle;
            margin-left: 10px;
        }

        .tweet{
            background-color: rgb(19, 175, 236);
            color: white;
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 18px;
            border-radius: 25px;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 18px;
            padding-right: 18px;
            margin-left: 150px;
            vertical-align: middle;
        }

        .box{
            border: solid;
            border-radius: 8px;
            border-width: 2px;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 12px;
            width: 530px;
            border-color: rgb(197, 197, 197);
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.2);

        }
    </style>
</head>
<body>
    <div class="box">
        <img class="cat" src="cat.png">
        <span class="text"> What's happening?</span>
        <span class="tweet"> Tweet</span>
    </div>
</body>
</html>
